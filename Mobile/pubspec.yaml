name: xepa
description: App para salvar comida de restaurantes, padarias, mercados e feiras.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^9.0.0
  cupertino_icons: ^2.0.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  signalr_netcore: ^1.4.4
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.3
  image_picker: ^1.2.4
  web: ^1.1.2
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  app_links: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
