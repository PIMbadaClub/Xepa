# CD: publica API, portal e app web no Azure a cada push na main.
#
# Só roda quando a variável do repositório AZURE_DEPLOY = true. Os recursos são criados por
# infra/azure/criar-recursos.sh, que também imprime os valores abaixo.
#   Secrets:   AZURE_PUBLISH_PROFILE_API, AZURE_PUBLISH_PROFILE_WEB (perfil de publicação de cada App Service)
#              AZURE_STORAGE_CONNECTION_STRING (Storage cujo site estático serve o app web)
#              SQL_CONNECTION_STRING (usada só para aplicar as migrations)
#   Variáveis: WEBAPP_API (ex.: xepa-api), WEBAPP_WEB (ex.: xepa-portal),
#              API_URL (ex.: https://xepa-api.azurewebsites.net, embutida no build do app)
# As configurações dos App Services (chaves, connection string, CORS) ficam no próprio Azure, não aqui.
# Publica o código direto no App Service (sem container), então não precisa de Container Registry.
name: CD

on:
  push:
    branches: [main]
    paths: ["Backend/**", "Mobile/**", ".github/workflows/cd.yml"]
  workflow_dispatch:

concurrency: producao

jobs:
  backend:
    if: vars.AZURE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: producao
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publicar binários
        run: |
          dotnet publish Xepa.Api -c Release -o ../publicar/api
          dotnet publish Xepa.Web -c Release -o ../publicar/web

      - name: Aplicar migrations no Azure SQL
        run: |
          dotnet tool restore
          dotnet ef migrations bundle --project Xepa.Infrastructure --startup-project Xepa.Api -o efbundle --force
          ./efbundle --connection "${{ secrets.SQL_CONNECTION_STRING }}"
        env:
          Jwt__Chave: "chave-somente-para-gerar-o-bundle-com-32-caracteres"

      - name: Publicar a API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.WEBAPP_API }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_API }}
          package: publicar/api

      - name: Publicar o portal
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.WEBAPP_WEB }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_WEB }}
          package: publicar/web

      - name: Verificar saúde
        run: |
          for app in ${{ vars.WEBAPP_API }} ${{ vars.WEBAPP_WEB }}; do
            for i in $(seq 1 30); do
              curl -fsS "https://$app.azurewebsites.net/health" && break
              sleep 10
            done || { echo "Health check falhou em $app"; exit 1; }
          done

  app-web:
    if: vars.AZURE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: producao
    defaults:
      run:
        working-directory: Mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build web --release --dart-define=API_URL=${{ vars.API_URL }}

      - name: Publicar no site estático do Storage
        run: az storage blob upload-batch -s build/web -d '$web' --overwrite -o none
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
