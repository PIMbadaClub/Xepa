# CI: compila e testa o backend a cada push e pull request.
name: CI

on:
  push:
    branches: [main, "sprint*"]
    paths: ["Backend/**", ".github/workflows/**"]
  pull_request:
    paths: ["Backend/**", ".github/workflows/**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore Xepa.sln
      - run: dotnet build Xepa.sln -c Release --no-restore
      - run: dotnet test Xepa.Tests -c Release --no-build --logger "trx;LogFileName=resultados.trx"

      - name: Migrations sem pendências no modelo
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project Xepa.Infrastructure --startup-project Xepa.Api --no-build --configuration Release
        env:
          ConnectionStrings__Xepa: "Server=nao-usado;Database=Xepa"
          Jwt__Chave: "chave-somente-para-o-ci-com-mais-de-32-caracteres"
