# CI: compila e testa o backend e o app a cada push e pull request, e gera o APK do Android.
name: CI

on:
  push:
    branches: [main, "sprint*"]
    paths: ["Backend/**", "Mobile/**", ".github/workflows/**"]
  pull_request:
    paths: ["Backend/**", "Mobile/**", ".github/workflows/**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore Xepa.sln
      - run: dotnet build Xepa.sln -c Release --no-restore
      - run: dotnet test Xepa.Tests -c Release --no-build --logger "trx;LogFileName=resultados.trx"

      - name: Migrations sem pendências no modelo
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project Xepa.Infrastructure --startup-project Xepa.Api --no-build --configuration Release
        env:
          ConnectionStrings__Xepa: "Server=nao-usado;Database=Xepa"
          Jwt__Chave: "chave-somente-para-o-ci-com-mais-de-32-caracteres"

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # APK de instalação direta (sem Play Store), baixável em Actions > execução > Artifacts.
  # Endereços da API e do portal vêm das variáveis do repositório; o Firebase (push) é opcional.
  apk:
    runs-on: ubuntu-latest
    needs: mobile
    defaults:
      run:
        working-directory: Mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: >
          flutter build apk --release
          --dart-define=API_URL=${{ vars.API_URL || 'https://xepa-api-12b52d.azurewebsites.net' }}
          --dart-define=PORTAL_URL=${{ vars.PORTAL_URL || 'https://xepa-portal-12b52d.azurewebsites.net' }}
          --dart-define=FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }}
          --dart-define=FIREBASE_APP_ID=${{ vars.FIREBASE_APP_ID }}
          --dart-define=FIREBASE_SENDER_ID=${{ vars.FIREBASE_SENDER_ID }}
          --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: xepa-android
          path: Mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
